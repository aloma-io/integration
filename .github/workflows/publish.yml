name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  # Runs the SDK build and tests on the tagged commit; the publish job needs it.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integration-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        run: npx yarn@1.22.22 build

      - name: Test
        run: npx yarn@1.22.22 test

  publish:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm@latest globally via tarball (bypasses self-replace MODULE_NOT_FOUND)
        run: |
          set -e
          NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/npm/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "Installing npm $NPM_VERSION via tarball"
          TARBALL_DIR=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar xz -C "$TARBALL_DIR"
          NPM_GLOBAL_PATH=$(node -p "require('path').resolve(process.execPath, '../../lib/node_modules')")
          echo "Replacing $NPM_GLOBAL_PATH/npm"
          rm -rf "$NPM_GLOBAL_PATH/npm"
          mv "$TARBALL_DIR/package" "$NPM_GLOBAL_PATH/npm"

      - name: Print npm version (diagnostic)
        run: npm --version

      - name: Install dependencies
        working-directory: integration-sdk
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        working-directory: integration-sdk
        run: npx yarn@1.22.22 build

      # The release bot cuts the tag; nothing else writes it into package.json. Tags look like 3.8.72 (older: v3.8.66).
      - name: Set package version from the tag
        working-directory: integration-sdk
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$GITHUB_REF_NAME' is not a plain x.y.z version" >&2
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if ! node -e 'const n = (v) => v.split("-")[0].split(".").map(Number); const [t, c] = [n(process.argv[1]), n(process.argv[2])]; process.exit((t[0] - c[0] || t[1] - c[1] || t[2] - c[2]) < 0 ? 1 : 0)' "$VERSION" "$CURRENT"; then
            echo "Tag version $VERSION is lower than the version $CURRENT in package.json" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: integration-sdk
        run: npm publish --access public --provenance

  # Runs the workspace-sdk build and tests on the tagged commit; the workspace publish job needs it.
  workspace-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workspace-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        run: npx yarn@1.22.22 build

      - name: Test
        run: npx yarn@1.22.22 test

  # Publishes workspace-sdk when it changed since the previous tag (one tag counter serves two packages; the version is
  # not the tag): the script raises the patch version itself and fails red when it cannot publish.
  workspace-publish:
    needs: [test, workspace-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm@latest globally via tarball (bypasses self-replace MODULE_NOT_FOUND)
        run: |
          set -e
          NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/npm/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "Installing npm $NPM_VERSION via tarball"
          TARBALL_DIR=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar xz -C "$TARBALL_DIR"
          NPM_GLOBAL_PATH=$(node -p "require('path').resolve(process.execPath, '../../lib/node_modules')")
          echo "Replacing $NPM_GLOBAL_PATH/npm"
          rm -rf "$NPM_GLOBAL_PATH/npm"
          mv "$TARBALL_DIR/package" "$NPM_GLOBAL_PATH/npm"

      - name: Print npm version (diagnostic)
        run: npm --version

      - name: Install dependencies
        working-directory: workspace-sdk
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        working-directory: workspace-sdk
        run: npx yarn@1.22.22 build

      # Raises workspace-sdk's patch version and publishes it when files under workspace-sdk/ changed since the previous
      # tag; fails when it cannot publish; says so in the log and skips when workspace-sdk/ did not change.
      - name: Publish workspace-sdk
        working-directory: workspace-sdk
        run: bash "$GITHUB_WORKSPACE/.github/scripts/workspace-publish.sh"
