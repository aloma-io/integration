name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  # Runs the SDK build and tests on the tagged commit; the publish job needs it.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integration-sdk
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        run: npx yarn@1.22.22 build

      - name: Test
        run: npx yarn@1.22.22 test

  publish:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm@latest globally via tarball (bypasses self-replace MODULE_NOT_FOUND)
        run: |
          set -e
          NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/npm/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "Installing npm $NPM_VERSION via tarball"
          TARBALL_DIR=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar xz -C "$TARBALL_DIR"
          NPM_GLOBAL_PATH=$(node -p "require('path').resolve(process.execPath, '../../lib/node_modules')")
          echo "Replacing $NPM_GLOBAL_PATH/npm"
          rm -rf "$NPM_GLOBAL_PATH/npm"
          mv "$TARBALL_DIR/package" "$NPM_GLOBAL_PATH/npm"

      - name: Print npm version (diagnostic)
        run: npm --version

      - name: Install dependencies
        working-directory: integration-sdk
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        working-directory: integration-sdk
        run: npx yarn@1.22.22 build

      - name: Publish
        working-directory: integration-sdk
        run: npm publish --access public --provenance

  # Runs the workspace-sdk build and tests on the tagged commit; the workspace publish job needs it.
  workspace-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workspace-sdk
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        run: npx yarn@1.22.22 build

      - name: Test
        run: npx yarn@1.22.22 test

  # Publishes the version in workspace-sdk/package.json (not the tag: one tag counter serves two packages) unless it is
  # already on npm.
  workspace-publish:
    needs: [test, workspace-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm@latest globally via tarball (bypasses self-replace MODULE_NOT_FOUND)
        run: |
          set -e
          NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/npm/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "Installing npm $NPM_VERSION via tarball"
          TARBALL_DIR=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar xz -C "$TARBALL_DIR"
          NPM_GLOBAL_PATH=$(node -p "require('path').resolve(process.execPath, '../../lib/node_modules')")
          echo "Replacing $NPM_GLOBAL_PATH/npm"
          rm -rf "$NPM_GLOBAL_PATH/npm"
          mv "$TARBALL_DIR/package" "$NPM_GLOBAL_PATH/npm"

      - name: Print npm version (diagnostic)
        run: npm --version

      - name: Install dependencies
        working-directory: workspace-sdk
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        working-directory: workspace-sdk
        run: npx yarn@1.22.22 build

      - name: Publish unless this version is already on npm
        working-directory: workspace-sdk
        run: |
          set -e
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/tmp/npm-view.err); then
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "$NAME@$VERSION already published, skipping"
              exit 0
            fi
          elif ! grep -q E404 /tmp/npm-view.err; then
            cat /tmp/npm-view.err
            exit 1
          fi
          npm publish --access public --provenance
