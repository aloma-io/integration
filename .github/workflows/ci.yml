name: ci

# Builds both packages and runs the integration SDK tests on every pull request and on main.
# Pull requests run Node 22 alone; pushes to main and manual runs use the full matrix (22, 24, 26).
# It publishes nothing and uses no secrets; publishing stays in publish.yml.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One run per pull request: a newer push cancels the older run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration_sdk:
    name: integration_sdk (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["22"]' || '["22","24","26"]') }}
    defaults:
      run:
        working-directory: integration-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        run: npx yarn@1.22.22 build

      # `yarn test` (tools/run-tests.mjs) runs the mocha describe/it files (generator, scenarios, connector harness)
      # in one mocha process and every standalone test script in its own node process.
      - name: Test
        run: npx yarn@1.22.22 test

  workspace_sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-engines

      - name: Build
        run: npx yarn@1.22.22 build

  # One check that stands for the whole run: it needs every job above and fails unless each one succeeded
  # (a skipped or cancelled job counts as a failure). Require this check, not the individual matrix names.
  ci-passed:
    name: ci-passed
    needs: [integration_sdk, workspace_sdk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          INTEGRATION_SDK: ${{ needs.integration_sdk.result }}
          WORKSPACE_SDK: ${{ needs.workspace_sdk.result }}
        run: |
          echo "integration_sdk: $INTEGRATION_SDK"
          echo "workspace_sdk: $WORKSPACE_SDK"
          test "$INTEGRATION_SDK" = success && test "$WORKSPACE_SDK" = success
